name: build-and-test
on: [push, pull_request]
jobs:
  mart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r requirements.txt && npm install
      - run: python build_mart.py            # fails if any blocking data-quality test fails
      - run: python build_mart.py --inject   # fails unless every planted defect is caught
      - run: python -m pytest -q
      - run: npm test                        # dashboard figures = mart figures
